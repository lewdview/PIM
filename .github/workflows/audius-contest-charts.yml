# Locks the Audius weekly top 5 and bakes each song's standard and Deluxe charts,
# so every player plays the same notes. Runs at 00:01 UTC every Monday, right as
# the new contest week starts and before the card-art job at 00:05.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   the project's service role key
#
# Run it by hand from the Actions tab (Run workflow) to bake the current week now.
name: Audius contest charts

on:
  schedule:
    - cron: '1 0 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebake songs that already have charts'
        type: boolean
        default: false

concurrency:
  group: audius-contest-charts
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Bake this week's charts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audius/bake_contest_charts.ts ${{ inputs.force && '--force' || '' }}
