<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background & Aura Glows -->
    <radialGradient id="archonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#9333EA" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#581C87" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="singularityCore" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F0ABFC" />
      <stop offset="55%" stop-color="#C084FC" />
      <stop offset="80%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#2E1065" />
    </radialGradient>

    <!-- Obsidian & Prismatic Metal Gradients -->
    <linearGradient id="obsidianMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="30%" stop-color="#190B38" />
      <stop offset="60%" stop-color="#0F0524" />
      <stop offset="100%" stop-color="#1F0E42" />
    </linearGradient>
    <linearGradient id="prismaticPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="archonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Filters -->
    <filter id="purpleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="singularityGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="2.8" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="archonGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" stroke="#9333EA" stroke-width="0.75" opacity="0.18" />
    </pattern>
  </defs>

  <!-- Ambient Mythic Singularity Aura -->
  <circle cx="250" cy="250" r="235" fill="url(#archonAura)" />

  <!-- Sacred Celestial Geometry Rings -->
  <g opacity="0.35" stroke="#C084FC" stroke-width="1.2" fill="none">
    <circle cx="250" cy="250" r="215" stroke-dasharray="8 12" />
    <circle cx="250" cy="250" r="185" stroke-dasharray="16 8 4 8" />
    <polygon points="250,35 436,142 436,357 250,465 64,357 64,142" stroke="url(#archonGold)" stroke-width="1" stroke-dasharray="6 10" />
    <line x1="250" y1="10" x2="250" y2="70" stroke="url(#prismaticPurple)" stroke-width="2" />
    <line x1="250" y1="430" x2="250" y2="490" stroke="url(#prismaticPurple)" stroke-width="2" />
    <line x1="10" y1="250" x2="70" y2="250" stroke="url(#prismaticPurple)" stroke-width="2" />
    <line x1="430" y1="250" x2="490" y2="250" stroke="url(#prismaticPurple)" stroke-width="2" />
  </g>

  <!-- Deep Ground Void Shadow -->
  <ellipse cx="250" cy="430" rx="170" ry="26" fill="#000000" opacity="0.8" />

  <!-- ARCHON HOARD CHASSIS (Monolithic Hexagonal Vault) -->
  <g id="ArchonHoardChest">
    <!-- Floating Lateral Quantum Pylons (Left & Right) -->
    <polygon points="50,220 75,190 75,310 50,280" fill="url(#obsidianMetal)" stroke="url(#prismaticPurple)" stroke-width="2" filter="url(#purpleGlow)" />
    <polygon points="450,220 425,190 425,310 450,280" fill="url(#obsidianMetal)" stroke="url(#prismaticPurple)" stroke-width="2" filter="url(#purpleGlow)" />

    <!-- Main Obsidian Monolith Hull -->
    <polygon points="120,120 380,120 430,190 430,340 380,410 120,410 70,340 70,190" 
             fill="url(#obsidianMetal)" stroke="#3B1768" stroke-width="4" />
    
    <polygon points="120,120 380,120 430,190 430,340 380,410 120,410 70,340 70,190" 
             fill="url(#archonGrid)" />

    <!-- Outer Gold Archon Runic Border Facets -->
    <polygon points="135,135 365,135 410,195 410,330 365,395 135,395 90,330 90,195" 
             fill="none" stroke="url(#archonGold)" stroke-width="4" filter="url(#purpleGlow)" />

    <!-- Top & Bottom Prismatic Emitter Ribs -->
    <path d="M 170 135 L 250 170 L 330 135" fill="none" stroke="url(#prismaticPurple)" stroke-width="4" stroke-linecap="round" filter="url(#purpleGlow)" />
    <path d="M 170 395 L 250 360 L 330 395" fill="none" stroke="url(#prismaticPurple)" stroke-width="4" stroke-linecap="round" filter="url(#purpleGlow)" />

    <!-- Lateral Energy Conduit Traces -->
    <line x1="90" y1="262" x2="155" y2="262" stroke="url(#prismaticPurple)" stroke-width="3" filter="url(#purpleGlow)" />
    <line x1="345" y1="262" x2="410" y2="262" stroke="url(#prismaticPurple)" stroke-width="3" filter="url(#purpleGlow)" />

    <!-- CENTRAL SINGULARITY QUANTUM CORE -->
    <g id="QuantumSingularity">
      <!-- Outer Resonance Ring -->
      <circle cx="250" cy="265" r="76" fill="none" stroke="url(#prismaticPurple)" stroke-width="2" stroke-dasharray="14 8 4 8" filter="url(#purpleGlow)" />
      
      <!-- Obsidian Containment Well -->
      <circle cx="250" cy="265" r="65" fill="#090214" stroke="url(#archonGold)" stroke-width="3" />

      <!-- Glowing Singularity Vortex -->
      <circle cx="250" cy="265" r="54" fill="url(#singularityCore)" filter="url(#singularityGlow)" opacity="0.95" />

      <!-- Levitating Archon Crest (Prismatic Crystal Diamond) -->
      <polygon points="250,225 282,265 250,305 218,265" fill="#FFFFFF" stroke="url(#archonGold)" stroke-width="2" filter="url(#purpleGlow)" />
      <polygon points="250,235 272,265 250,295 228,265" fill="#F5D0FE" opacity="0.8" />
      <circle cx="250" cy="265" r="5" fill="#FFFFFF" filter="url(#purpleGlow)" />
    </g>

    <!-- Corner Inscribed Runes & Gold Emblems -->
    <polygon points="120,175 145,160 145,190" fill="url(#archonGold)" />
    <polygon points="380,175 355,160 355,190" fill="url(#archonGold)" />
    <polygon points="120,350 145,365 145,335" fill="url(#archonGold)" />
    <polygon points="380,350 355,365 355,335" fill="url(#archonGold)" />

    <!-- Top Archon Registry Badge -->
    <rect x="185" y="145" width="130" height="16" rx="3" fill="#130729" stroke="url(#archonGold)" stroke-width="1.5" />
    <text x="250" y="157" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="8.5" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="2">
      ARCHON // OMEGA
    </text>

    <!-- Floating Quantum Sparks -->
    <circle cx="205" cy="190" r="3" fill="#E879F9" filter="url(#purpleGlow)" />
    <circle cx="295" cy="190" r="3" fill="#E879F9" filter="url(#purpleGlow)" />
    <circle cx="185" cy="310" r="2.5" fill="#C084FC" filter="url(#purpleGlow)" />
    <circle cx="315" cy="310" r="2.5" fill="#C084FC" filter="url(#purpleGlow)" />
    <circle cx="250" cy="100" r="3.5" fill="#FFFFFF" filter="url(#purpleGlow)" />
  </g>

  <!-- Technical Telemetry Typography & Labels -->
  <g font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="10" font-weight="900" fill="#C084FC" letter-spacing="2">
    <text x="250" y="445" text-anchor="middle" opacity="0.9">ARCHON HOARD // 7000 SPK</text>
    <text x="250" y="463" text-anchor="middle" font-size="8" fill="#E879F9" opacity="0.7">OMEGA SINGULARITY TREASURY</text>
  </g>
</svg>
