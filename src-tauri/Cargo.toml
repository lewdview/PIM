[package]
name = "pim-vault-desktop"
version = "0.1.0"
description = "PIM : th3v4ult — Poetry in Motion Desktop Engine"
authors = ["th3scr1b3 <contact@pim.th3scr1b3.art>"]
edition = "2021"

[lib]
name = "pim_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
